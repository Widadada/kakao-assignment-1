<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주간 Todo 스케줄러</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>나의 할 일</h1>
        </header>
        
        <main>
            <div class="week-container">
                <button id="prev-week-btn" class="nav-btn">&lt;</button>
                <div id="week-days-container"></div>
                <button id="next-week-btn" class="nav-btn">&gt;</button>
            </div>

            <div class="input-container">
                <input type="text" id="todo-input" placeholder="새로운 할 일을 입력하세요...">
                <button id="add-button">추가</button>
            </div>
            
            <p id="error-message" class="hidden">할 일을 입력해주세요!</p>

            <div class="filter-container">
                <button class="filter-btn active" data-filter="all">전체</button>
                <button class="filter-btn" data-filter="active">진행 중</button>
                <button class="filter-btn" data-filter="completed">완료</button>
            </div>

            <ul id="todo-list"></ul>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
